; PlatformIO Project Configuration File for TESA Top Gun Rally 2026
; Dual-Target Support: ESP32 WROOM-32 (Test) and ESP32-S3-N16R8 (Competition)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ==============================================================================
; 1. Target: ESP32 WROOM-32 (บอร์ดทดลองเริ่มต้น)
; ==============================================================================
[env:esp32dev]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMQTT_MAX_PACKET_SIZE=512

; ==============================================================================
; 2. Target: ESP32-S3 N16R8 (บอร์ดแข่งจริง - 16MB Flash / 8MB OPI PSRAM)
; ==============================================================================
[env:esp32-s3-n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DMQTT_MAX_PACKET_SIZE=512
